<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FedEx 8402 Louisville — Location Demo</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src https://www.google.com; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'"><style>body.fedex-driver-open{overflow:hidden}.fedex-resource-launch{width:100%;text-align:left;font:inherit}.fedex-driver-dialog{inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#f6f8fc;color:#10182d}.fedex-driver-dialog::backdrop{background:#05080d}.fedex-driver-shell{min-height:100%;background:#f6f8fc}.fedex-driver-header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px max(18px,env(safe-area-inset-left)) 12px;background:#fff;border-bottom:1px solid #dfe5ef}.fedex-driver-header small{display:block;color:#8190a9;text-align:center}.fedex-driver-header>button{width:44px;height:44px;border:1px solid #d5ddea;border-radius:12px;background:#fff;font-size:27px}.fedex-wordmark{font-size:clamp(28px,6vw,48px);font-weight:900;color:#4d148c;line-height:1}.fedex-wordmark b{color:#ff6200}.fedex-driver-body{width:min(1100px,100%);margin:auto;padding:20px clamp(14px,3vw,34px) calc(40px + env(safe-area-inset-bottom))}.fedex-driver-loading,.fedex-driver-empty,.fedex-driver-message{text-align:center;padding:45px 20px;color:#8190a9}.fedex-driver-message button{margin-top:15px}.fedex-driver-search{width:min(620px,100%);margin:0 auto 22px}.fedex-driver-search label{color:#33415a;margin:12px 0 6px}.fedex-driver-search select,.fedex-driver-search input{background:#fff;color:#10182d;border:1px solid #cad4e3}.fedex-driver-search select{font-size:14px;line-height:1.25;padding-left:11px;padding-right:30px}.fedex-location-picker{position:relative;border:1px solid #cad4e3;border-radius:14px;background:#fff;color:#10182d}.fedex-location-picker summary{padding:14px 42px 14px 14px;list-style:none;font-size:16px;font-weight:700;line-height:1.3;cursor:pointer;overflow-wrap:anywhere}.fedex-location-picker summary::-webkit-details-marker{display:none}.fedex-location-picker summary::after{content:"⌄";position:absolute;right:15px;top:13px;font-size:20px}.fedex-location-picker[open] summary::after{content:"⌃"}.fedex-location-options{max-height:min(52vh,430px);overflow-y:auto;border-top:1px solid #dfe5ef;padding:6px}.fedex-location-options button{display:grid;grid-template-columns:minmax(48px,auto) minmax(0,1fr);align-items:start;gap:8px;width:100%;padding:12px 10px;border:0;border-radius:9px;background:#fff;color:#10182d;text-align:left;font-size:15px;line-height:1.25}.fedex-location-options button+button{border-top:1px solid #edf0f5}.fedex-location-options button:active,.fedex-location-options button:focus{background:#f0eafa;outline:none}.fedex-location-options strong{color:#4d148c;white-space:nowrap}.fedex-location-options span{min-width:0;overflow-wrap:anywhere}.fedex-code-entry{display:grid;grid-template-columns:1fr 58px}.fedex-code-entry input{border-radius:14px 0 0 14px}.fedex-code-entry button{border:0;border-radius:0 14px 14px 0;background:#4d148c;color:#fff;font-size:24px}.fedex-search-message{text-align:center;color:#77869f;font-size:13px}.fedex-location-card{overflow:hidden;background:#fff;border:1px solid #dfe5ef;border-radius:20px;box-shadow:0 14px 36px #17243d14}.fedex-driver-map-wrap{position:relative}.fedex-driver-map-wrap iframe{display:block;width:100%;height:390px;border:0}.fedex-driver-zoom{position:absolute;left:12px;top:12px;display:grid;overflow:hidden;border:1px solid #cad4e3;border-radius:9px;box-shadow:0 3px 10px #11182730}.fedex-driver-zoom button{width:42px;height:40px;padding:0;border:0;border-radius:0;background:#fff;color:#10182d;font-size:25px}.fedex-driver-zoom button+button{border-top:1px solid #cad4e3}.fedex-driver-locate{position:absolute;right:12px;bottom:12px;width:44px;height:44px;padding:0;border:1px solid #cad4e3;border-radius:10px;background:#fff;color:#23324a;font-size:21px;box-shadow:0 3px 10px #11182730}.fedex-driver-map-status{position:absolute;right:64px;bottom:12px;max-width:280px;padding:8px 10px;border-radius:8px;background:#fff;color:#33415a;font-size:12px;box-shadow:0 3px 10px #11182730}.fedex-driver-map-status:empty{display:none}.fedex-driver-summary{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;padding:24px}.fedex-driver-summary h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px);color:#10182d}.fedex-driver-summary p{margin:5px 0;color:#52617a;font-size:18px}.fedex-driver-summary small{color:#90a0b8}.fedex-driver-actions{display:grid;gap:9px;min-width:190px}.fedex-driver-actions a,.fedex-driver-actions button,.fedex-driver-message button{display:block;padding:12px 15px;border:1px solid #cad4e3;border-radius:10px;background:#fff;color:#293851;text-align:center;text-decoration:none;font-weight:800}.fedex-driver-actions a:first-child{background:#4d148c;color:#fff;border-color:#4d148c}.fedex-driver-routes{padding:0 24px}.fedex-driver-routes details{margin-bottom:12px;border:1px solid #dfe5ef;border-radius:14px;background:#f6f8fc;overflow:hidden}.fedex-driver-routes summary{display:flex;justify-content:space-between;gap:15px;padding:18px;cursor:pointer;font-weight:800}.fedex-driver-routes p{margin:0;padding:0 18px 18px;white-space:pre-wrap;line-height:1.55;color:#405069}.fedex-driver-details{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:28px 24px}.fedex-driver-details h2{margin:20px 0 8px;font-size:20px}.fedex-driver-details h2:first-child{margin-top:0}.fedex-driver-details p{white-space:pre-wrap;line-height:1.55;color:#405069}.fedex-driver-figures{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.fedex-driver-figures button{padding:0;border:0;border-radius:12px;background:#eef2f7;overflow:hidden}.fedex-driver-figures img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.fedex-driver-links{display:grid;gap:9px}.fedex-driver-links a{padding:12px;border:1px solid #d5ddea;border-radius:10px;color:#4d148c;text-decoration:none;font-weight:700}.fedex-driver-photo{inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:50px 14px 14px;border:0;background:#05070b}.fedex-driver-photo::backdrop{background:#05070b}.fedex-driver-photo img{display:block;max-width:100%;max-height:calc(100dvh - 70px);margin:auto}.fedex-driver-photo button{position:absolute;right:14px;top:10px;width:42px;height:42px;border:0;border-radius:10px;background:#fff;color:#111827;font-size:25px}@media(max-width:700px){.fedex-driver-map-wrap iframe{height:300px}.fedex-driver-summary{display:block}.fedex-driver-actions{margin-top:18px;min-width:0}.fedex-driver-details{grid-template-columns:1fr}.fedex-driver-routes summary{font-size:14px}.fedex-wordmark{font-size:29px}.fedex-driver-header small{text-align:left}}@media(max-width:380px){.fedex-driver-body{padding-left:10px;padding-right:10px}.fedex-driver-summary,.fedex-driver-details{padding-left:16px;padding-right:16px}.fedex-driver-routes{padding:0 16px}}body{margin:0;background:#edf1f7;font:16px system-ui;color:#172334}.welcome{max-width:650px;margin:8vh auto;padding:28px}.welcome button{padding:16px 24px;border:0;border-radius:12px;background:#4d148c;color:white;font:700 18px system-ui}.demo-caption{font-size:14px;color:#526273}.fedex-driver-dialog{max-height:100dvh}</style></head><body><main class="welcome"><p class="demo-caption">Wade Freight Systems · Location demo · September 15, 2026</p><h1>8402 Louisville</h1><p>Explore the saved location details, map, directions, yard instructions, and related routes.</p><button data-open-fedex-locations>Open Louisville Demo</button><p class="demo-caption">Only location 8402 is included. Maps and external navigation require internet. Location records cannot be edited here.</p></main><script>window.DEMO_LOUISVILLE={"code": "8402", "name": "Louisville", "address": "12900 Plantside Drive", "phone": null, "latitude": 38.208477, "longitude": -85.518372, "directions": "Two options based on traffic. 1- 24W to Exit 52A (left fork) towards 24W and 65N, Right lane and take Exit 211 to 65N. 2- Take 24W to 840E Exit 74A to Exit 72B to Rt 109N and follow to 65N. You will come onto 65 at the TN/KY border. Take 65N to 265E Exit 125A Gene Snyder Pkwy to Exit 23 Taylorsville Rd and turn left at the light. Turn right at Blankenbaker Pkwy (913) and take that to Plantside Drive and turn right. Yard will be on the right.", "instructions": "When you enter the yard thru the gate, Turn right. The angled parking you see to your right are the inbound spots. Drop your trailers there and wait for your \"meet.\"", "notes": "If you need linehaul or the restrooms, linehaul is halfway down the first aisle. As you go around the building to leave make sure (if you have doubles) that your chains are attached properly. Show your trip buddy app to the guard at the gate so they can verify your destination. Trip buddy IS your gate pass", "routes": [{"to": "371", "from": "8402", "directions": "Turn left onto Plantside Drive and then turn left onto Blankenbaker Pkwy. At the overpass, enter the highway (265). Exit 10A (65S). Follow 65S down to Exit 90A Briley Pkwy (155W) and follow that to Exit 19 Whites Creek Pike. Turn left and continue to Knight Drive and turn left at the light. As soon as you pass under the overpass, the entrance to the yard is to the right. \nDO NOT CONTINUE STRAIGHT. There is no way for you to turn around.\nAngled parking to your right is Inbound"}, {"to": "377", "from": "8402", "directions": "Leave the yard, turn left onto Plantside Drive, turn left onto Blankenbaker Pkwy. At the overpass, enter the highway (265) and take that down to Exit 10A (65S). \n65S to 24E towards Chattanooga, right 2 lanes at split follow signs to Chattanooga. Exit 84B (Joe B Jackson), go past the Burger King on the left and turn left onto Elam Road, 3rd entrance on left side turn left towards the yard."}], "links": [], "id": "demo-8402", "figures": []};</script><script>(() => {
  "use strict";
  const client = window.FP365_DRIVER_CLIENT;
  const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
  const byId = id => document.getElementById(id);
  let locations = [], selected = null, zoom = 15;

  function numericSort(a, b) {
    return Number(a.code) - Number(b.code) || String(a.code).localeCompare(String(b.code));
  }

  function ensureDialog() {
    if (byId("fedexDriverDialog")) return;
    const dialog = document.createElement("dialog");
    dialog.id = "fedexDriverDialog";
    dialog.className = "fedex-driver-dialog";
    dialog.innerHTML = `
      <div class="fedex-driver-shell">
        <header class="fedex-driver-header">
          <div><div class="fedex-wordmark"><span>Fed</span><b>Ex</b> Locations</div><small>Wade Freight Systems · Demo</small></div>
          <button id="fedexDriverClose" type="button" aria-label="Close FedEx Locations">×</button>
        </header>
        <main id="fedexDriverBody" class="fedex-driver-body"></main>
      </div>`;
    document.body.appendChild(dialog);
    byId("fedexDriverClose").onclick = closeLocations;
    dialog.addEventListener("cancel", event => { event.preventDefault(); closeLocations(); });

    const photo = document.createElement("dialog");
    photo.id = "fedexDriverPhoto";
    photo.className = "fedex-driver-photo";
    photo.innerHTML = '<button id="fedexDriverPhotoClose" type="button" aria-label="Close photo">×</button><img id="fedexDriverPhotoImage" alt="FedEx location reference">';
    document.body.appendChild(photo);
    byId("fedexDriverPhotoClose").onclick = () => photo.close();
  }

  async function signedFigures(rows) {
    return Promise.all((rows || []).sort((a,b) => a.display_order - b.display_order).map(async row => {
      const {data, error} = await client.storage.from("fedex-location-figures").createSignedUrl(row.storage_path, 3600);
      return {...row, url: error ? "" : data?.signedUrl || ""};
    }));
  }

  async function loadLocations() { locations = [structuredClone(window.DEMO_LOUISVILLE)]; }
  async function openLocations() {
    ensureDialog();
    const sourceModal = byId("modal");
    if (sourceModal?.open) sourceModal.close();
    byId("fedexDriverBody").innerHTML = '<div class="fedex-driver-loading">Loading FedEx locations…</div>';
    byId("fedexDriverDialog").showModal();
    document.body.classList.add("fedex-driver-open");
    try {
      await loadLocations();
      renderLookup();
    } catch (error) {
      byId("fedexDriverBody").innerHTML = `<section class="fedex-driver-message"><h2>Locations unavailable</h2><p>${esc(error.message)}</p><button type="button" data-fedex-return>Return to Home</button></section>`;
      byId("fedexDriverBody").querySelector("[data-fedex-return]").onclick = closeLocations;
    }
  }

  function closeLocations() {
    byId("fedexDriverDialog")?.close();
    document.body.classList.remove("fedex-driver-open");
    selected = null;
  }

  function renderLookup() {
    const body = byId("fedexDriverBody");
    body.innerHTML = `
      <section class="fedex-driver-search">
        <label>Select a location</label>
        <details id="fedexDriverPicker" class="fedex-location-picker">
          <summary id="fedexDriverPickerLabel">Choose a location</summary>
          <div class="fedex-location-options" role="listbox">${locations.map(row => `<button type="button" role="option" data-fedex-location="${esc(row.id)}"><strong>${esc(row.code)}</strong><span>${esc(row.name)}</span></button>`).join("")}</div>
        </details>
        <label for="fedexDriverCode">Enter location code</label>
        <div class="fedex-code-entry"><input id="fedexDriverCode" inputmode="numeric" maxlength="10" placeholder="Location code"><button id="fedexDriverFind" type="button" aria-label="Find location">→</button></div>
        <p id="fedexDriverSearchMsg" class="fedex-search-message">${locations.length} location${locations.length === 1 ? "" : "s"} available</p>
      </section>
      <section id="fedexDriverResult" class="fedex-driver-result"><div class="fedex-driver-empty">Choose a location or enter its code.</div></section>`;
    body.querySelectorAll("[data-fedex-location]").forEach(button => button.onclick = () => showLocation(button.dataset.fedexLocation));
    byId("fedexDriverFind").onclick = findCode;
    byId("fedexDriverCode").onkeydown = event => { if (event.key === "Enter") findCode(); };
    byId("fedexDriverCode").oninput = event => { event.target.value = event.target.value.replace(/\D/g, "").slice(0,10); };
  }

  function findCode() {
    const code = byId("fedexDriverCode").value.trim();
    const match = locations.find(row => row.code === code);
    if (!match) {
      byId("fedexDriverSearchMsg").textContent = code ? `Location ${code} was not found.` : "Enter a location code.";
      return;
    }
    showLocation(match.id);
  }

  const mapUrl = (latitude, longitude, level = zoom) => `https://www.google.com/maps?q=${latitude},${longitude}&z=${level}&output=embed`;

  function showLocation(id) {
    selected = locations.find(row => row.id === id);
    if (!selected) return;
    byId("fedexDriverPickerLabel").textContent = `${selected.code} — ${selected.name}`;
    byId("fedexDriverPicker").open = false;
    zoom = 15;
    const routes = (selected.routes || []).filter(route => route.from && route.to);
    const hasMap = selected.latitude != null && selected.longitude != null;
    const mapsUrl = hasMap
      ? `https://www.google.com/maps/search/?api=1&query=${selected.latitude},${selected.longitude}`
      : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selected.address || `${selected.code} ${selected.name}`)}`;
    byId("fedexDriverResult").innerHTML = `
      <article class="fedex-location-card">
        ${hasMap ? `<div class="fedex-driver-map-wrap"><iframe id="fedexDriverMap" title="${esc(selected.code)} location map" src="${mapUrl(selected.latitude,selected.longitude)}"></iframe><div class="fedex-driver-zoom"><button type="button" data-fedex-zoom="1" aria-label="Zoom in">+</button><button type="button" data-fedex-zoom="-1" aria-label="Zoom out">−</button></div><button id="fedexDriverLocate" class="fedex-driver-locate" type="button" aria-label="Show current location" title="Show current location">➤</button><span id="fedexDriverMapStatus" class="fedex-driver-map-status"></span></div>` : ""}
        <section class="fedex-driver-summary">
          <div><h1>${esc(selected.code)} ${esc(selected.name)}</h1><p>${esc(selected.address || "Address unavailable")}</p><small>${selected.latitude ?? "—"}, ${selected.longitude ?? "—"}</small></div>
          <div class="fedex-driver-actions"><a href="${mapsUrl}" target="_blank" rel="noopener">⌖ Open in Maps</a>${selected.phone ? `<a href="tel:${String(selected.phone).replace(/\D/g,"")}">☎ Call</a>` : ""}<button type="button" data-fedex-return>⌂ Return to Home</button></div>
        </section>
        ${routes.length ? `<section class="fedex-driver-routes">${routes.map((route,index) => `<details><summary><span>FROM${index ? ` (${index+1})` : ""}: ${esc(route.from)}</span><span>TO${index ? ` (${index+1})` : ""}: ${esc(route.to)}</span></summary><p>${esc(route.directions || "No route directions added.")}</p></details>`).join("")}</section>` : ""}
        <section class="fedex-driver-details"><div><h2>Directions</h2><p>${esc(selected.directions || "No general directions added.")}</p><h2>Instructions</h2><p>${esc(selected.instructions || "No instructions added.")}</p><h2>Notes</h2><p>${esc(selected.notes || "No notes added.")}</p></div><div><h2>Reference Figures</h2><div class="fedex-driver-figures">${selected.figures.filter(row => row.url).map((row,index) => `<button type="button" data-fedex-photo="${index}"><img src="${row.url}" alt="${esc(row.original_name || `Reference photo ${index+1}`)}"></button>`).join("") || '<p>No reference figures added.</p>'}</div><h2>External Links</h2><div class="fedex-driver-links">${(selected.links || []).filter(link => link.url).map(link => `<a href="${esc(link.url)}" target="_blank" rel="noopener">${esc(link.title || link.url)}</a>`).join("") || '<p>No external links added.</p>'}</div></div></section>
      </article>`;
    byId("fedexDriverResult").querySelector("[data-fedex-return]").onclick = closeLocations;
    byId("fedexDriverResult").querySelectorAll("[data-fedex-zoom]").forEach(button => button.onclick = () => changeZoom(Number(button.dataset.fedexZoom)));
    if (byId("fedexDriverLocate")) byId("fedexDriverLocate").onclick = locateDevice;
    byId("fedexDriverResult").querySelectorAll("[data-fedex-photo]").forEach(button => button.onclick = () => openPhoto(Number(button.dataset.fedexPhoto)));
    byId("fedexDriverResult").scrollIntoView({behavior:"smooth",block:"start"});
  }

  function changeZoom(delta) {
    if (!selected || !byId("fedexDriverMap")) return;
    zoom = Math.max(3, Math.min(20, zoom + delta));
    byId("fedexDriverMap").src = mapUrl(selected.latitude, selected.longitude, zoom);
  }

  function locateDevice() {
    const status = byId("fedexDriverMapStatus"), button = byId("fedexDriverLocate");
    if (!navigator.geolocation) { status.textContent = "Current location is unavailable."; return; }
    button.disabled = true; status.textContent = "Finding your location…";
    navigator.geolocation.getCurrentPosition(position => {
      byId("fedexDriverMap").src = mapUrl(position.coords.latitude, position.coords.longitude, 16);
      status.textContent = "Showing your current location."; button.disabled = false;
    }, error => {
      status.textContent = error.code === 1 ? "Location permission was denied." : "Current location could not be found.";
      button.disabled = false;
    }, {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  }

  function openPhoto(index) {
    const figure = selected?.figures?.filter(row => row.url)[index];
    if (!figure) return;
    byId("fedexDriverPhotoImage").src = figure.url;
    byId("fedexDriverPhoto").showModal();
  }

  document.addEventListener("click", event => {
    if (event.target.closest("[data-open-fedex-locations]")) openLocations();
  });
  window.FP365_OPEN_FEDEX_LOCATIONS = openLocations;
})();
</script><script>window.FP365_OPEN_FEDEX_LOCATIONS();</script></body></html>
