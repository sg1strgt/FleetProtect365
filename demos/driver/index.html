<style>:root{
  --bg:#05080d;--panel:#0a1420;--panel2:#101d2c;--line:#263649;
  --text:#f7f8fc;--muted:#aeb8c7;--accent:#7b5cff;--accent2:#9a84ff;
  --danger:#ff5c57;--ok:#27c36a;--warn:#ffb020;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:520px;min-height:100vh;margin:auto;padding:env(safe-area-inset-top) 16px calc(94px + env(safe-area-inset-bottom));background:radial-gradient(circle at 90% 0,rgba(123,92,255,.22),transparent 34%),#07101a}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:12px 0 14px;background:rgba(7,16,26,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.topbar-actions{width:48px;height:48px;display:grid;place-items:center}.topbar-actions .icon-btn{grid-area:1/1}
.brand{font-weight:900;font-size:20px}.screen-title{font-size:13px;color:var(--muted);margin-top:2px}
.icon-btn{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:26px}
.hidden{visibility:hidden}
main{padding-top:18px}
.card{background:linear-gradient(180deg,rgba(16,29,44,.98),rgba(8,18,28,.98));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 16px 36px rgba(0,0,0,.18)}
.hero{padding:20px}.hero h1{font-size:28px;line-height:1.08;margin:0 0 8px;overflow-wrap:anywhere}.hero p{color:var(--muted);margin:0;line-height:1.45}
.grid{display:grid;gap:12px}.grid.two{grid-template-columns:1fr 1fr}
.primary,.secondary,.danger,.success,.choice{width:100%;min-height:56px;border-radius:16px;padding:14px 16px;border:1px solid transparent;font-weight:800}
.primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}
.secondary{background:var(--panel2);border-color:var(--line);color:var(--text)}
.danger{background:rgba(255,92,87,.15);border-color:rgba(255,92,87,.5);color:#ffd5d3}
.success{background:rgba(39,195,106,.16);border-color:rgba(39,195,106,.5);color:#d8ffe8}
.choice{background:var(--panel2);border-color:var(--line);color:var(--text);text-align:left}
.choice strong{display:block;font-size:20px}.choice span{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.incident-choice{border-color:rgba(255,92,87,.7);background:linear-gradient(180deg,rgba(111,24,27,.48),rgba(61,16,20,.42))}.incident-choice strong{color:#ff8b87}
label{display:block;font-weight:800;margin:14px 0 7px}
input,select,textarea{width:100%;border-radius:14px;border:1px solid var(--line);background:#07111c;color:var(--text);padding:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
.field-help,.muted{color:var(--muted);font-size:13px;line-height:1.4}
.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:rgba(123,92,255,.16);border:1px solid rgba(123,92,255,.45);font-size:12px;font-weight:800}
.photo-item{padding:14px 0;border-bottom:1px solid var(--line)}
.photo-item:last-child{border-bottom:0}
.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.file-label{display:flex;justify-content:center;align-items:center;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-weight:800;margin:0;padding:10px;text-align:center}
.file-label input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.photo-preview{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px;border:1px solid var(--line)}
.status{font-size:13px;font-weight:800}.status.ok{color:var(--ok)}.status.missing{color:var(--warn)}
.entry{width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left}
.entry:last-child{border-bottom:0}.entry h3{margin:0 0 6px}.entry p{margin:4px 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0}.check input{width:24px;height:24px;flex:none;margin:0}
.alert{padding:12px 14px;border-radius:14px;margin-bottom:12px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.4);color:#ffe4a3}
.okbox{padding:12px 14px;border-radius:14px;margin-bottom:12px;background:rgba(39,195,106,.12);border:1px solid rgba(39,195,106,.4);color:#d8ffe8}
.footer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(520px,100%);display:flex;justify-content:space-between;align-items:center;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:rgba(7,16,26,.97);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.text-btn{background:none;border:0;color:var(--accent2);font-weight:800;padding:8px 0}
.modal{border:0;border-radius:20px;background:transparent;color:var(--text);width:min(440px,calc(100% - 32px))}
.modal::backdrop{background:rgba(0,0,0,.72)}.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.modal-card h2{margin-top:0}
.detail-list{display:grid;gap:10px}.detail-row{padding-bottom:10px;border-bottom:1px solid var(--line)}.detail-row:last-child{border-bottom:0}
.small{font-size:12px}
.resource-list{display:grid;gap:10px;margin:14px 0}.resource-link{display:block;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);text-decoration:none}.resource-link strong{display:block}.resource-link span{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px}
.resource-section{margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden}.resource-section summary{padding:15px 16px;font-weight:800;cursor:pointer;list-style:none}.resource-section summary::-webkit-details-marker{display:none}.resource-section summary::after{content:"+";float:right;font-size:20px;line-height:1}.resource-section[open] summary::after{content:"−"}.resource-section .resource-list{margin:0;padding:0 12px 12px}.resource-section .resource-empty{margin:0;padding:0 16px 16px;color:var(--muted)}
@media(max-width:380px){.grid.two,.photo-actions{grid-template-columns:1fr}.hero h1{font-size:25px}}

/* Driver-only entry visibility; keyboard and desktop users can also remove. */
.entry-swipe{position:relative;overflow:hidden;margin-bottom:12px;border-radius:12px}
.entry-swipe .open-entry{position:relative;margin:0;width:100%;transition:transform .18s ease;touch-action:pan-y;background:var(--card,#101c2a)}
.entry-remove{position:absolute;right:0;top:0;bottom:0;width:88px;margin:0}
.entry-swipe.revealed .open-entry,.entry-swipe:focus-within .open-entry{transform:translateX(-96px)}
@media(hover:hover){.entry-swipe .open-entry{width:calc(100% - 96px)}.entry-swipe:focus-within .open-entry{transform:none}}

.topbar-leading{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:46px}
.topbar-leading .hidden{display:none}

    return Number.isFinite(configured) && configured > 0 ? configured : 24;
  }

  async function removeConfirmedEntriesAfterRetentionPeriod() {
    const cutoff = Date.now() - (localEntryRetentionHours() * 60 * 60 * 1000);
    const kept = state.entries.filter((entry) => {
      if (!entry.end_shift_email_confirmed_at) return true;
      if (!entry.synced_to_supabase || !entry.photos_synced_to_supabase) return true;
      const confirmed = Date.parse(entry.end_shift_email_confirmed_at);
      return !Number.isFinite(confirmed) || confirmed > cutoff;
    });
    if (kept.length !== state.entries.length) {
      state.entries = kept;
      await dbSet("entries", state.entries);
    }
  }

  function readJson(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch {
      return fallback;
    }
  }

  function writeJson(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function esc(s = "") {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    })[c]);
  }

  function showModal(t, body) {
    document.getElementById("modalTitle").textContent = t;
    document.getElementById("modalBody").innerHTML = body;
    modal.showModal();
  }

  function navigate(screen, push = true) {
    if (push && state.screen !== screen) state.history.push(state.screen);
    state.screen = screen;
    render();
  }

  function goBack() {
    const prev = state.history.pop();
    if (prev) {
      state.screen = prev;
      render();
    }
  }

  function goHome() {
    state.history = [];
    state.screen = state.user ? "home" : "login";
    render();

  async function fileRecord(file) {
    const dataUrl = await compressImage(file, 640, 0.42);
    return { name: file.name || `photo-${Date.now()}.jpg`, size: file.size, type: file.type, data_url: dataUrl };
  }

  function compressImage(file, maxDimension, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Unable to read photo."));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Unable to process photo."));
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, maxDimension / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function driverEntries() {
    const employeeId = state.user?.employee_id;

  function entryViewKey(entry) {

  async function removeEntryFromView(id) {
    const entry = driverEntries().find(item => item.id === id);
    if (!entry || !window.confirm("Remove this entry from View Entries on this device? The sample inspection stays available for the demo End-of-Shift report.")) return;
    const hidden = [...new Set([...state.hiddenEntryKeys, entryViewKey(entry)])];
    try {
      // Store only a view preference; never mutate or delete inspection records.
      await dbSet("hiddenEntryKeys", hidden);
      state.hiddenEntryKeys = hidden;
      renderEntries();
    } catch (error) {
      showModal("Unable to remove entry", "<p>The entry is still visible. Device storage could not save the change. Please try again.</p>");
    }
  }

  function renderEntries() {
    header("My Entries");

    main.innerHTML = `<section class="card"><h2>Submitted entries</h2>
      ${entries.length ? entries.map(e => `
        <div class="entry-swipe">
        <button type="button" class="entry-remove danger" data-remove-id="${esc(e.id)}" aria-label="Remove entry from View Entries">Remove</button>
        <button class="entry open-entry" data-id="${esc(e.id)}">
          <h3>${esc(equipment[e.type]?.label || e.type)}</h3>
          <p>${esc(e.from)} → ${esc(e.to)}</p>
          <p>Truck ${esc(e.truck)}${e.trailer1 ? ` • Trailer ${esc(e.trailer1)}`:""}</p>
          <p>${new Date(e.submitted_at).toLocaleString()}</p>

    document.querySelectorAll(".entry-remove").forEach(button => {
      button.onclick = () => removeEntryFromView(button.dataset.removeId);
    });
    document.querySelectorAll(".entry-swipe").forEach(row => {
      let start = null;
      let swiped = false;
      row.addEventListener("touchstart", event => {
        const touch = event.touches[0];
        start = { x: touch.clientX, y: touch.clientY };
        swiped = false;
      }, { passive: true });
      row.addEventListener("touchend", event => {
        if (!start) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - start.x, dy = touch.clientY - start.y;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          row.classList.toggle("revealed", dx < 0);
          swiped = true;
        }
        start = null;
      }, { passive: true });
      row.addEventListener("touchcancel", () => { start = null; }, { passive: true });
      row.addEventListener("click", event => {
        if (swiped) { event.preventDefault(); event.stopPropagation(); swiped = false; }
      }, true);
    });
    document.querySelectorAll(".open-entry").forEach(button => {
      button.onclick = () => {
        state.selectedEntry = entries.find(e => e.id === button.dataset.id) || null;

  async function submitIncidentReport() {
    const incident = state.incident;
    const values = {
      city: document.getElementById("incidentCity").value.trim(),
      mile_marker: document.getElementById("incidentMileMarker").value.trim(),
      nearest_exit: document.getElementById("incidentExit").value.trim(),
      highway: document.getElementById("incidentHighway").value.trim(),
      direction: document.getElementById("incidentDirection").value,
      injuries: document.getElementById("incidentInjuries").value,
      hazmat: document.getElementById("incidentHazmat").value,
      fuel_spill: document.getElementById("incidentFuel").value,
      driver_statement: document.getElementById("incidentStatement").value.trim(),
      witness_info: document.getElementById("incidentWitness").value.trim(),
      tow_name: document.getElementById("incidentTowName").value.trim(),
      tow_phone: document.getElementById("incidentTowPhone").value.trim(),
      police_report_number: document.getElementById("incidentPoliceReport").value.trim(),
      officer: document.getElementById("incidentOfficer").value.trim(),
      police_department: document.getElementById("incidentDepartment").value.trim(),
      police_phone: document.getElementById("incidentPolicePhone").value.trim(),
      incident_details: document.getElementById("incidentDetailsText").value.trim()
    };
    incident.details = values;
    const required = [["Nearest City / Town", values.city], ["Mile Marker", values.mile_marker], ["Nearest Exit", values.nearest_exit], ["Highway", values.highway], ["Direction", values.direction], ["Injuries or fatalities", values.injuries], ["Hazardous materials", values.hazmat], ["Fuel spilled", values.fuel_spill], ["Driver statement and sequence of events", values.driver_statement], ["Details of Incident", values.incident_details]];
    const missing = required.filter(([, value]) => !value).map(([label]) => label);
    if (missing.length) return showModal("Complete required details", `<p>${missing.map(esc).join("<br>")}</p>`);
    if (!supabaseClient) return showModal("Report service unavailable", "<p>Supabase is not configured.</p>");
    const button = document.getElementById("submitIncidentReport");
    button.disabled = true;
    button.textContent = "Creating and sending report...";
    try {
      const { data, error } = await supabaseClient.functions.invoke("send-incident-report", { body: {
        driver: { full_name: state.user?.full_name || "", employee_id: state.user?.employee_id || "", email: state.user?.email || "" },
        opened_at: incident.opened_at,
        gps: incident.gps,
        equipment: incident.equipment,
        details: incident.details,
        photos: incident.photos,
        time_zone: Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Chicago"
      }});
      if (error) throw error;
      if (!data?.ok) throw new Error(data?.error || "Report delivery was not confirmed.");
      state.incident = null;
      goHome();
      showModal("Demo incident report created", `<p>Report ${esc(data.report_id)} was downloaded as a printable demo report. Nothing was emailed or archived.</p>`);
    } catch (error) {
      button.disabled = false;
      button.textContent = "Create Demo Report";
      showModal("Report could not be confirmed", `<p>${esc(error.message || String(error))}</p><p>Your report remains open. Correct the issue and try again.</p>`);
    }
  }

function renderEndShift() {
    header("End of Shift");
    const items = checklistItems("question_post");

    const now = new Date();
    const todayEntries = driverEntries().filter(entry => {
      const submitted = new Date(entry.submitted_at || entry.created_at);
      return submitted.getFullYear() === now.getFullYear()
        && submitted.getMonth() === now.getMonth()
        && submitted.getDate() === now.getDate();
    }).sort((a, b) => {
      const aSubmitted = new Date(a.submitted_at || a.created_at).getTime();
      const bSubmitted = new Date(b.submitted_at || b.created_at).getTime();
      return aSubmitted - bSubmitted;
    });

    main.innerHTML = `
      <section class="card">
        <h2>End-of-shift checklist</h2>
        <p class="field-help">${todayEntries.length} submitted entr${todayEntries.length === 1 ? "y" : "ies"} found for today.</p>
        ${todayEntries.length === 0 ? `<div class="alert">No inspections are available to email for today.</div>` : ""}
        ${items.map(x => `<label class="check"><input class="shift" type="checkbox"><span>${esc(x)}</span></label>`).join("")}
      </section>
      <button id="finishShift" class="success" ${todayEntries.length === 0 ? "disabled" : ""}>
        Create Demo Report and Complete End of Shift
      </button>`;

    document.getElementById("finishShift").onclick = async () => {
      if ([...document.querySelectorAll(".shift")].some(x => !x.checked)) {
        return showModal("Checklist incomplete", "<p>Every item must be confirmed before completing End of Shift.</p>");
      }
      if (!todayEntries.length) return showModal("No inspections found", "<p>There are no submitted inspections for today.</p>");
      if (!supabaseClient) return showModal("Email not configured", "<p>Supabase is not configured in config.js.</p>");

      // Reserve the report tab during the tap, before asynchronous inspection syncing.
      const reportWindow = window.open("about:blank", "_blank");
      if (!reportWindow) {
        return showModal("Allow the report tab", "<p>Please allow pop-ups for this demo, then tap End of Shift again. Your shift has not been completed.</p>");
      }
      reportWindow.opener = null;
      reportWindow.document.title = "Preparing End-of-Shift report";
      reportWindow.document.body.textContent = "Preparing your End-of-Shift report…";
      let reportUrl;

      const button = document.getElementById("finishShift");
      button.disabled = true;
      button.textContent = "Creating demo report…";

      const payload = {
        driver: {
          full_name: state.user?.full_name || "",
          employee_id: state.user?.employee_id || "",
          email: state.user?.email || ""
        },
        shift_date: [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, "0"),
          String(now.getDate()).padStart(2, "0")
        ].join("-"),
        entries: todayEntries,
        app_version: cfg.APP_VERSION || "Driver v1.7"
      };

      try {
        const syncFailures = await syncPendingInspections();
        const unsynced = todayEntries.filter(entry =>
          !entry.synced_to_supabase || !entry.photos_synced_to_supabase
        );
        if (unsynced.length) {
          const matchingFailure = syncFailures.find(({ entry }) => unsynced.some(item => item.id === entry.id));
          throw new Error(matchingFailure?.error?.message || "The inspection or its photos are still uploading. Please keep the app open and try End of Shift again.");
        }
        const { data, error } = await supabaseClient.functions.invoke(
          cfg.END_SHIFT_FUNCTION || "send-end-shift",
          { body: payload }
        );
        if (error) throw error;
        if (!data?.ok) throw new Error(data?.error || "The report email was not confirmed.");

        reportUrl = data.report_url;
        if (!reportUrl) throw new Error("The demo report could not be opened. Please try again.");
        if (reportWindow.closed) throw new Error("The report tab was closed. Please try again and leave it open.");
        reportWindow.location.replace(reportUrl);

        const confirmedAt = new Date().toISOString();
        todayEntries.forEach((entry) => {
          entry.end_shift_email_confirmed_at = confirmedAt;
        });
        await dbSet("entries", state.entries);

        showModal(
          "Demo report opened",
          `<p>Your printable demo End-of-Shift report containing ${todayEntries.length} inspection${todayEntries.length === 1 ? "" : "s"} opened in a new browser tab. Use Print in that tab to save as PDF. Nothing was emailed.</p><p>Have a good night.</p>`
        );
        await supabaseClient.auth.signOut();
        localStorage.removeItem("fp365_user");
        state.user = null;
        state.history = [];
        state.screen = "login";
        setTimeout(render, 500);
      } catch (err) {
        if (!reportUrl && !reportWindow.closed) reportWindow.close();
        button.disabled = false;
        button.textContent = "Create Demo Report and Complete End of Shift";
        showModal(
          "End of Shift could not be confirmed",
          `<p>${esc(err.message || String(err))}</p><p>The report may have been delivered, but completion was not confirmed.</p><p>You can try again or log out now.</p><button type="button" id="endShiftErrorLogout" class="danger">Log Out Now</button>`
        );
        document.getElementById("endShiftErrorLogout").onclick = logoutDriver;

  function renderFeedback() {

      <section class="card">
        <h2>Send feedback</h2>
        <label>Name</label>
        <input id="fbName" value="${esc(state.user?.full_name || "")}" />
        <label>Category</label>
        <select id="fbCategory">
          <option value="suggestion">Suggestion</option>

      const category = document.getElementById("fbCategory").value;

        submitted_by: name,
        employee_id: state.user?.employee_id || null,
        category, message,
        app_version: cfg.APP_VERSION || "Driver v1.7",
        user_agent: navigator.userAgent,
        submitted_at: new Date().toISOString()
      };

        showModal("Thank you", "<p>Demo feedback accepted. Nothing was sent.</p>");
        msg.value = "";
        document.getElementById("charCount").textContent = "0 / 750";
      } catch (err) {
        showModal("Unable to submit", `<p>${esc(err.message || String(err))}</p>`);
      }
    };
  }

  async function init() {

    const oldEntries = readJson("fp365_entries", []);
    state.draft = await dbGet("draft", oldDraft);
    state.entries = await dbGet("entries", oldEntries);
    state.hiddenEntryKeys = await dbGet("hiddenEntryKeys", []);

    if (oldDraft && !(await dbGet("draft", null))) await dbSet("draft", oldDraft);
    if (oldEntries.length && !(await dbGet("entries", null))) await dbSet("entries", oldEntries);

    localStorage.removeItem("fp365_draft");
    localStorage.removeItem("fp365_entries");
    await removeConfirmedEntriesAfterRetentionPeriod();
    if (supabaseClient) {
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) {
        state.user = null;
        localStorage.removeItem("fp365_user");
        state.screen = "login";
      } else {
        await Promise.all([loadActiveTrucks(), loadCompanyContent(), loadCompanyPreferences()]);
        await removeConfirmedEntriesAfterRetentionPeriod();
        await syncPendingInspections();
      }
    }
    render();
  }

  init().catch(err => {
    console.error(err);
    render();
    showModal("Storage notice", "<p>The app opened, but device storage could not be initialized.</p>");
  });
})();

})();
