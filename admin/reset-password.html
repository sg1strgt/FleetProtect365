<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset Password · Fleet Protect 365</title><style>body{margin:0;background:#edf2f7;color:#142334;font:16px system-ui,sans-serif}main{max-width:420px;margin:8vh auto;padding:28px;background:white;border-radius:16px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #b9c6d4;border-radius:8px}button{margin-top:18px;background:#1766b3;color:white;cursor:pointer}a{color:#1766b3}#status{line-height:1.5}[hidden]{display:none!important}@media(max-width:500px){main{margin:24px 16px}}</style></head>
<body><main><h1 id="heading">Forgot password?</h1><form id="requestForm"><p>Enter your admin email address to request a password-reset link.</p><label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="email" required><button id="sendReset" type="submit">Send reset link</button></form><form id="passwordForm" hidden><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><p>Use at least 8 characters, including a capital letter and a number.</p><button id="savePassword" type="submit">Save new password</button></form><p id="status" role="status" aria-live="polite"></p><a href="./">Back to Admin Login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=20260725-live-2"></script><script src="./reset-password.js?v=20260910-1"></script></body></html>
